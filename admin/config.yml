backend:
  name: github
  repo: Harishik-ram/Stars_medical
  branch: main

site_url: https://harishik-ram.github.io/Stars_medical
display_url: https://harishik-ram.github.io/Stars_medical

media_folder: assets/blog
public_folder: /Stars_medical/assets/blog

slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: blog
    label: Blog Posts
    label_singular: Blog Post
    folder: _posts
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    preview_path: blog/{{slug}}/
    sortable_fields: [date, title]
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Publish Date, name: date, widget: datetime }
      - { label: Cover Image, name: cover, widget: image, required: false, hint: "Shown on the blog page and at the top of the post." }
      - { label: Short Summary, name: description, widget: text, required: false, hint: "One or two lines shown on the blog listing page." }
      - { label: Body, name: body, widget: markdown }
